<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com html5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video src="midia/Boxeaiai.mp4" width="500" controls></video>
    <video src="midia/Boxeaiaiweb.webm" width="500" controls></video>
    <video src="midia/boxeaiaiogv.ogv" width="500"></video>
    <h2>Outro jeito de mostrar vídeo</h2>
    <video controls width="500" poster = "imagens/limoes.jpg" controls>
        <source src = "midia/Boxeaiaiweb.webm" type = "video/webm">
        <source src = "midia/boxeaia.mp4" type = "video/mp4">
        <source src = "midia/boxeaiaiogv.ogv" type = "video/ogg">
        <p>Seu navegador não tem compatiblidade com reprodução de vídeo</p>
    </video>
    <h1>Inserindo vídeos do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/3hng-hmSv2Y?si=OvKnhI6N6b2xAz-j" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
