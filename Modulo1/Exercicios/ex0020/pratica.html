<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento CSS</title>
    <style>
        div > p{
            display: none;
        }
        div:hover > p{
            display: block;
            color: black;
            background-color: rgba(0, 0, 255, 0.35);
            width: 200px;
        }
        div:hover{
            cursor: default;
        }
    </style>
</head>
<body>
    <h1>Treinamento de aparecer coisas na tela</h1>
    <div>
        Passe o mouse aqui porra!!!
        <p>!!!Texto escondido otário XD!!!</p>
    </div>

</body>
</html>
