<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Passe o mouse na imagem</h1>
    <img src="relampago_marquinhos.jpg" alt="relampago marquinhos meme" id = "foto">

    <script>
    var foto1 = window.document.getElementById("foto")
    foto1.addEventListener("mouseenter", mouseEntrou)
    
    function mouseEntrou(){
        foto1.src = "buzz.jpeg"
    }
    </script>
</body>
</html>
