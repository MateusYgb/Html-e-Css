<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Vamos trabalhar com imagens</h1>
    
    <h1>Imagem dinamica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width: 700px)" srcset="imagens/img300.png" type = "image/png">
        <source media= "(max-width:1050px)" srcset="imagens/img700.png" type = "image/png">
        <img src="imagens/img_1000.png" alt="imagem flexivel">
    </picture>

    <h1>Reproduzindo áudio</h1>
    <p>Vamos aprender a reproduzir áudio no html 5</p>
    <audio src="midia/Soldierboy.mp3" controls autoplay></audio>
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/Soldierboy.mp3" type="audio/mpeg">
        <source src="midia/Soldierboy.mp3" type="audtio/ogg">
        <source src="midia/Soldierboy.mp3" type="audio/wav">
        <p>Infelizmente o seu navegador não consegue rodar mp3</p>

        <a href="midia/Soldierboy.mp3">Clique aqui para baixar o arquivo</a>
    </audio>
    <!-- MP3 WAV OGG formas de adiocionar áudio-->
</body>
</html>
