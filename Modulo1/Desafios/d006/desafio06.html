<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio das tags</title>
</head>
<body>
    <h1><abbr title="tag: &lt; t &gt;">Este é um titulo</abbr></h1>
    <p><abbr title="tag: &lt; p &gt;">este é um paragrafo</abbr></p>
    <li><abbr title="tag: &lt; li &gt;">items de uma lista</abbr></li>
    <a href="facebook.com"><abbr title=" tag: &lt; a &gt;">tag de link</abbr></a>
    <p><mark><abbr title="tag: &lt; mark &gt;">texto marcado</abbr></mark></p>
    <p><small><abbr title="tag: &lt; small &gt;">texto pequeno</abbr></small></p>
    <p><ins><abbr title="tag: &lt; ins &gt;">tag sublinhado</abbr></ins></p>
    <p><in><abbr title="tag: &lt; in &gt;">tag em italico</abbr></in></p>
    <p><strong><abbr title="tag: &lt; strong &gt;">tag em negrito</abbr></strong></p>
    <p><abbr title="tag: &lt; img &gt;"><img src="" alt="tag imagem"></abbr></p>
    <dd>
        <dt>aiai
            <dl>aiaiai</dl>
        </dt>
         
    </dd>
</body>
</html>
